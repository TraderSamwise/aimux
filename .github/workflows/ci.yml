name: ci

on:
  pull_request:
  push:
    branches:
      - master

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TARGET_DIR: /tmp/aimux-cargo-target-ci
  AIMUX_HOME: ${{ runner.temp }}/aimux-home
  AIMUX_DAEMON_PORT: "47390"

jobs:
  rust-format-advisory:
    name: Rust format advisory
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - run: rustup component add rustfmt

      - name: cargo fmt --check
        run: yarn native:fmt:check

  rust-clippy:
    name: Rust clippy all targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            /tmp/aimux-cargo-target-ci
          key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('native/Cargo.lock') }}-${{ hashFiles('native/crates/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('native/Cargo.lock') }}-
            ${{ runner.os }}-${{ github.job }}-cargo-

      - run: rustup component add clippy

      - name: cargo clippy --all-targets
        run: yarn native:clippy:all-targets

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            /tmp/aimux-cargo-target-ci
          key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('native/Cargo.lock') }}-${{ hashFiles('native/crates/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('native/Cargo.lock') }}-
            ${{ runner.os }}-${{ github.job }}-cargo-

      - name: Prepare isolated Aimux home
        run: |
          mkdir -p "$AIMUX_HOME"
          printf '{"kind":"github-actions","ownerPid":%s}\n' "$$" > "$AIMUX_HOME/test-isolation.json"

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: cargo test
        run: yarn native:test
