name: ci

on:
  pull_request:
  push:
    branches:
      - master

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TARGET_DIR: /tmp/aimux-cargo-target-ci
  AIMUX_DAEMON_PORT: "47390"

jobs:
  js-tests:
    name: JavaScript tests (root/relay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            relay/node_modules
          key: ${{ runner.os }}-${{ github.job }}-node-${{ hashFiles('.nvmrc', 'yarn.lock', 'relay/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.job }}-node-

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile
          yarn --cwd relay install --ignore-scripts --frozen-lockfile

      - name: yarn test
        run: yarn test

  app-js-tests:
    name: JavaScript tests (app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: ${{ runner.os }}-${{ github.job }}-node-${{ hashFiles('.nvmrc', 'app/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.job }}-node-

      - name: Install dependencies
        run: yarn --cwd app install --frozen-lockfile

      - name: yarn --cwd app test
        run: yarn --cwd app test

  rust-format:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare job Aimux env
        run: echo "AIMUX_HOME=$RUNNER_TEMP/aimux-home" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal --component rustfmt

      - name: cargo fmt --check
        run: yarn native:fmt:check

  rust-clippy:
    name: Rust clippy all targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare job Aimux env
        run: echo "AIMUX_HOME=$RUNNER_TEMP/aimux-home" >> "$GITHUB_ENV"

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            /tmp/aimux-cargo-target-ci
          key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('native/Cargo.lock') }}-${{ hashFiles('native/crates/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('native/Cargo.lock') }}-
            ${{ runner.os }}-${{ github.job }}-cargo-

      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal --component clippy

      - name: cargo clippy --all-targets
        run: yarn native:clippy:all-targets

  rust-tests:
    name: Rust tests (Linux)
    runs-on: ubuntu-latest
    # Blocking shipped-platform coverage. Desktop notifications are
    # macOS-only, so Linux asserts the platform-unsupported contract instead of
    # pretending a helper exists. cargo test uses --no-fail-fast so a red
    # library target cannot hide the integration binaries that carry most
    # fixture and contract coverage.
    steps:
      - uses: actions/checkout@v4

      - name: Prepare job Aimux env
        run: |
          echo "AIMUX_HOME=$RUNNER_TEMP/aimux-home" >> "$GITHUB_ENV"
          echo "AIMUX_TMUX_SOCKET_PATH=$RUNNER_TEMP/aimux-tmux.sock" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            /tmp/aimux-cargo-target-ci
          key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('native/Cargo.lock') }}-${{ hashFiles('native/crates/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('native/Cargo.lock') }}-
            ${{ runner.os }}-${{ github.job }}-cargo-

      - name: Prepare isolated Aimux home
        run: |
          mkdir -p "$AIMUX_HOME"
          # This marker intentionally disables the cargo-test materialization
          # guard for CI's disposable AIMUX_HOME. A test that relies on ambient
          # AIMUX_HOME can pass here while being refused on a developer laptop.
          printf '{"kind":"github-actions","ownerPid":%s}\n' "$$" > "$AIMUX_HOME/test-isolation.json"

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: cargo test
        run: yarn native:test

  rust-tests-macos:
    name: Rust tests (macOS)
    runs-on: macos-latest
    # Blocking Rust test gate. The Node parity contracts were captured on
    # macOS; Linux still runs separately as advisory shipped-platform coverage.
    steps:
      - uses: actions/checkout@v4

      - name: Prepare job Aimux env
        run: |
          echo "AIMUX_HOME=$RUNNER_TEMP/aimux-home" >> "$GITHUB_ENV"
          echo "AIMUX_TMUX_SOCKET_PATH=$RUNNER_TEMP/aimux-tmux.sock" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            /tmp/aimux-cargo-target-ci
          key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('native/Cargo.lock') }}-${{ hashFiles('native/crates/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('native/Cargo.lock') }}-
            ${{ runner.os }}-${{ github.job }}-cargo-

      - name: Prepare isolated Aimux home
        run: |
          mkdir -p "$AIMUX_HOME"
          # This marker intentionally disables the cargo-test materialization
          # guard for CI's disposable AIMUX_HOME. A test that relies on ambient
          # AIMUX_HOME can pass here while being refused on a developer laptop.
          printf '{"kind":"github-actions","ownerPid":%s}\n' "$$" > "$AIMUX_HOME/test-isolation.json"

      - name: Ensure tmux is available
        run: |
          if command -v tmux >/dev/null 2>&1; then
            tmux -V
          else
            brew install tmux
            tmux -V
          fi

      - name: cargo test
        env:
          # The parity corpus covers macOS zsh shell integration. Keep the
          # shell explicit, but do not spoof the runner's home directory; tests
          # that compare home-derived paths must normalize those paths instead.
          SHELL: /bin/zsh
        run: yarn native:test

  phase8-live-residuals:
    name: Phase 8 live residuals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ github.job }}-node-${{ hashFiles('.nvmrc', 'yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.job }}-node-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Install tmux and process probes
        run: |
          sudo apt-get update
          sudo apt-get install -y lsof tmux
          tmux -V
          lsof -v >/dev/null

      - name: Build native binary
        run: cargo build --manifest-path native/Cargo.toml -p aimux --bin aimux

      - name: Run live tmux residual
        env:
          AIMUX_HOME: ${{ runner.temp }}/aimux-home-phase8-tmux
        run: |
          yarn audit:phase8-live-residuals:tmux \
            --skip-build \
            --aimux-bin "$CARGO_TARGET_DIR/debug/aimux"

      - name: Run live command-resolution residual
        env:
          AIMUX_HOME: ${{ runner.temp }}/aimux-home-phase8-command-resolution
        run: |
          yarn audit:phase8-live-residuals:command-resolution \
            --skip-build \
            --aimux-bin "$CARGO_TARGET_DIR/debug/aimux"

      - name: Run live agent-shell residual
        env:
          AIMUX_HOME: ${{ runner.temp }}/aimux-home-phase8-agent-shell
        run: |
          yarn audit:phase8-live-residuals:agent-shell \
            --skip-build \
            --aimux-bin "$CARGO_TARGET_DIR/debug/aimux"

      - name: Run live graveyard residual
        env:
          AIMUX_HOME: ${{ runner.temp }}/aimux-home-phase8-graveyard
        run: |
          yarn audit:phase8-live-residuals:graveyard \
            --skip-build \
            --aimux-bin "$CARGO_TARGET_DIR/debug/aimux"

      - name: Run live Expose residual
        env:
          AIMUX_HOME: ${{ runner.temp }}/aimux-home-phase8-expose-interaction
        run: |
          yarn audit:phase8-live-residuals:expose-interaction \
            --skip-build \
            --aimux-bin "$CARGO_TARGET_DIR/debug/aimux"

      - name: Run live SSE residual
        env:
          AIMUX_HOME: ${{ runner.temp }}/aimux-home-phase8-sse
        run: |
          yarn audit:phase8-live-residuals:sse \
            --skip-build \
            --aimux-bin "$CARGO_TARGET_DIR/debug/aimux"

      - name: Run live process residual
        env:
          AIMUX_HOME: ${{ runner.temp }}/aimux-home-phase8-process
        run: |
          yarn audit:phase8-live-residuals:process \
            --skip-build \
            --aimux-bin "$CARGO_TARGET_DIR/debug/aimux"
