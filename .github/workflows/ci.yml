name: ci

# Actions is free on this public repo, so CI is free parallel compute. It runs
# on every push precisely so the full suite does NOT have to run serially on a
# laptop before pushing: `yarn verify` locally, everything else here.
# Not on tags. `release:patch` pushes master and the tag together, so a tag
# trigger runs this same commit a second time for nothing -- 13 minutes a tag, at
# three tags a day.
on:
  pull_request:
  push:
    branches:
      - master

# One CI run per ref. A tag push lands the branch and the tag together, which
# fired two identical runs, and every superseded push kept running to
# completion while a newer commit was already the answer.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TARGET_DIR: /tmp/aimux-cargo-target-ci

jobs:
  js-tests:
    name: JavaScript tests (root/relay)
    runs-on: ubuntu-latest
    env:
      AIMUX_DAEMON_PORT: "47390"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit hook attestations
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            bash scripts/check-commit-hook-attestations.sh "origin/${GITHUB_BASE_REF}..HEAD"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            bash scripts/check-commit-hook-attestations.sh "${{ github.event.before }}..HEAD"
          fi

      - name: Install Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            relay/node_modules
          key: ${{ runner.os }}-${{ github.job }}-node-${{ hashFiles('.nvmrc', 'yarn.lock', 'relay/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.job }}-node-

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile
          yarn --cwd relay install --ignore-scripts --frozen-lockfile

      - name: yarn test
        run: yarn test

  app-js-tests:
    name: JavaScript tests (app)
    runs-on: ubuntu-latest
    env:
      AIMUX_DAEMON_PORT: "47390"
    steps:
      - uses: actions/checkout@v4

      - name: Install Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: ${{ runner.os }}-${{ github.job }}-node-${{ hashFiles('.nvmrc', 'app/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.job }}-node-

      - name: Install dependencies
        run: yarn --cwd app install --frozen-lockfile

      - name: yarn --cwd app lint
        run: yarn --cwd app lint --max-warnings=0

      - name: yarn --cwd app test
        run: yarn --cwd app test

  app-android-native:
    name: Android native compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: yarn --cwd app install --frozen-lockfile

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Nothing else compiles this Kotlin. `app/plugins/android/*.kt` reaches a
      # build only through the config plugin at prebuild, so without this job a
      # source that does not compile merges green.
      - name: yarn --cwd app verify:android-native
        run: yarn --cwd app verify:android-native

  rust-format:
    name: Rust format
    runs-on: ubuntu-latest
    env:
      AIMUX_DAEMON_PORT: "47390"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare job Aimux env
        run: echo "AIMUX_HOME=$RUNNER_TEMP/aimux-home" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal --component rustfmt
      # The rewrite brought compile time into CI and the caching strategy never
      # followed it: every cache here was node_modules, so each Rust job
      # cold-built the whole crate. That is most of this workflow's minutes.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: cargo fmt --check
        run: yarn native:fmt:check

  rust-clippy:
    name: Rust clippy all targets
    runs-on: ubuntu-latest
    env:
      AIMUX_DAEMON_PORT: "47390"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare job Aimux env
        run: echo "AIMUX_HOME=$RUNNER_TEMP/aimux-home" >> "$GITHUB_ENV"

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            /tmp/aimux-cargo-target-ci
          key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('native/Cargo.lock') }}-${{ hashFiles('native/crates/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('native/Cargo.lock') }}-
            ${{ runner.os }}-${{ github.job }}-cargo-

      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal --component clippy
      # The rewrite brought compile time into CI and the caching strategy never
      # followed it: every cache here was node_modules, so each Rust job
      # cold-built the whole crate. That is most of this workflow's minutes.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: cargo clippy --all-targets
        run: yarn native:clippy:all-targets

  rust-tests:
    name: Rust tests (Linux)
    runs-on: ubuntu-latest
    # Blocking shipped-platform coverage. Desktop notifications are
    # macOS-only, so Linux asserts the platform-unsupported contract instead of
    # pretending a helper exists. cargo test uses --no-fail-fast so a red
    # library target cannot hide the integration binaries that carry most
    # fixture and contract coverage.
    env:
      AIMUX_DAEMON_PORT: "47390"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare job Aimux env
        run: |
          echo "AIMUX_HOME=$RUNNER_TEMP/aimux-home" >> "$GITHUB_ENV"
          echo "AIMUX_TMUX_SOCKET_PATH=$RUNNER_TEMP/aimux-tmux.sock" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal
      # The rewrite brought compile time into CI and the caching strategy never
      # followed it: every cache here was node_modules, so each Rust job
      # cold-built the whole crate. That is most of this workflow's minutes.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            /tmp/aimux-cargo-target-ci
          key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('native/Cargo.lock') }}-${{ hashFiles('native/crates/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('native/Cargo.lock') }}-
            ${{ runner.os }}-${{ github.job }}-cargo-

      - name: Prepare isolated Aimux home
        run: |
          echo "AIMUX_TEST_HARNESS=github-actions" >> "$GITHUB_ENV"
          mkdir -p "$AIMUX_HOME"
          # This marker intentionally disables the cargo-test materialization
          # guard for CI's disposable AIMUX_HOME. A test that relies on ambient
          # AIMUX_HOME can pass here while being refused on a developer laptop.
          printf '{"kind":"github-actions","ownerPid":%s}\n' "$$" > "$AIMUX_HOME/test-isolation.json"

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: cargo test
        run: yarn native:test

  rust-tests-macos:
    name: Rust tests (macOS)
    runs-on: macos-latest
    # Blocking Rust test gate. The Node parity contracts were captured on
    # macOS; Linux still runs separately as advisory shipped-platform coverage.
    env:
      AIMUX_DAEMON_PORT: "47390"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare job Aimux env
        run: |
          echo "AIMUX_HOME=$RUNNER_TEMP/aimux-home" >> "$GITHUB_ENV"
          echo "AIMUX_TMUX_SOCKET_PATH=$RUNNER_TEMP/aimux-tmux.sock" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native


      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            /tmp/aimux-cargo-target-ci
          key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('native/Cargo.lock') }}-${{ hashFiles('native/crates/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('native/Cargo.lock') }}-
            ${{ runner.os }}-${{ github.job }}-cargo-

      - name: Prepare isolated Aimux home
        run: |
          echo "AIMUX_TEST_HARNESS=github-actions" >> "$GITHUB_ENV"
          mkdir -p "$AIMUX_HOME"
          # This marker intentionally disables the cargo-test materialization
          # guard for CI's disposable AIMUX_HOME. A test that relies on ambient
          # AIMUX_HOME can pass here while being refused on a developer laptop.
          printf '{"kind":"github-actions","ownerPid":%s}\n' "$$" > "$AIMUX_HOME/test-isolation.json"

      - name: Ensure tmux is available
        run: |
          if command -v tmux >/dev/null 2>&1; then
            tmux -V
          else
            brew install tmux
            tmux -V
          fi

      - name: cargo test
        env:
          # The parity corpus covers macOS zsh shell integration. Keep the
          # shell explicit, but do not spoof the runner's home directory; tests
          # that compare home-derived paths must normalize those paths instead.
          SHELL: /bin/zsh
        run: yarn native:test

  # These four used to run only on the release tag, so a master push could
  # be green while the thing that actually gates a release was never asked.
  # The tag lane now trusts this run for the commit it points at.
  static-checks:
    name: Static checks and source audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            app/yarn.lock

      - run: corepack enable

      - run: yarn install --frozen-lockfile

      - run: yarn --cwd app install --frozen-lockfile

      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Prepare isolated Aimux runtime
        run: |
          set -euo pipefail
          echo "AIMUX_HOME=$RUNNER_TEMP/aimux-home-${{ github.job }}" >> "$GITHUB_ENV"
          echo "AIMUX_TEST_HARNESS=github-actions" >> "$GITHUB_ENV"
          echo "AIMUX_TMUX_SOCKET_PATH=$RUNNER_TEMP/aimux-${{ github.job }}-tmux.sock" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/aimux-home-${{ github.job }}"
          printf '{"kind":"github-actions","ownerPid":%s}\n' "$$" > "$RUNNER_TEMP/aimux-home-${{ github.job }}/test-isolation.json"

      - name: Ensure tmux is available
        run: |
          set -euo pipefail
          command -v tmux >/dev/null 2>&1 && { tmux -V; exit 0; }
          sudo apt-get update
          sudo apt-get install -y tmux
          tmux -V

      - run: yarn verify

      # Two `cargo build --release` passes, so it belongs on free parallel
      # compute rather than in front of every local change.
      - run: yarn native:local-boundary

  idle-spawn:
    name: Idle process spawn rate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            app/yarn.lock

      - run: corepack enable

      - run: yarn install --frozen-lockfile

      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Prepare isolated Aimux runtime
        run: |
          set -euo pipefail
          echo "AIMUX_HOME=$RUNNER_TEMP/aimux-home-${{ github.job }}" >> "$GITHUB_ENV"
          echo "AIMUX_TEST_HARNESS=github-actions" >> "$GITHUB_ENV"
          echo "AIMUX_TMUX_SOCKET_PATH=$RUNNER_TEMP/aimux-${{ github.job }}-tmux.sock" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/aimux-home-${{ github.job }}"
          printf '{"kind":"github-actions","ownerPid":%s}\n' "$$" > "$RUNNER_TEMP/aimux-home-${{ github.job }}/test-isolation.json"

      - name: Ensure tmux is available
        run: |
          set -euo pipefail
          command -v tmux >/dev/null 2>&1 && { tmux -V; exit 0; }
          sudo apt-get update
          sudo apt-get install -y tmux
          tmux -V

      - run: yarn audit:idle-process-spawn

  installed-gate:
    name: Installed runtime gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            app/yarn.lock

      - run: corepack enable

      - run: yarn install --frozen-lockfile

      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Prepare isolated Aimux runtime
        run: |
          set -euo pipefail
          echo "AIMUX_HOME=$RUNNER_TEMP/aimux-home-${{ github.job }}" >> "$GITHUB_ENV"
          echo "AIMUX_TEST_HARNESS=github-actions" >> "$GITHUB_ENV"
          echo "AIMUX_TMUX_SOCKET_PATH=$RUNNER_TEMP/aimux-${{ github.job }}-tmux.sock" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/aimux-home-${{ github.job }}"
          printf '{"kind":"github-actions","ownerPid":%s}\n' "$$" > "$RUNNER_TEMP/aimux-home-${{ github.job }}/test-isolation.json"

      - name: Ensure tmux is available
        run: |
          set -euo pipefail
          command -v tmux >/dev/null 2>&1 && { tmux -V; exit 0; }
          sudo apt-get update
          sudo apt-get install -y tmux
          tmux -V

      - run: yarn installed:gate

  installed-local-gate:
    name: Installed local-only runtime gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            app/yarn.lock

      - run: corepack enable

      - run: yarn install --frozen-lockfile

      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Prepare isolated Aimux runtime
        run: |
          set -euo pipefail
          echo "AIMUX_HOME=$RUNNER_TEMP/aimux-home-${{ github.job }}" >> "$GITHUB_ENV"
          echo "AIMUX_TEST_HARNESS=github-actions" >> "$GITHUB_ENV"
          echo "AIMUX_TMUX_SOCKET_PATH=$RUNNER_TEMP/aimux-${{ github.job }}-tmux.sock" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/aimux-home-${{ github.job }}"
          printf '{"kind":"github-actions","ownerPid":%s}\n' "$$" > "$RUNNER_TEMP/aimux-home-${{ github.job }}/test-isolation.json"

      - name: Ensure tmux is available
        run: |
          set -euo pipefail
          command -v tmux >/dev/null 2>&1 && { tmux -V; exit 0; }
          sudo apt-get update
          sudo apt-get install -y tmux
          tmux -V

      - run: yarn installed:local-gate

  phase8-live-residuals:
    name: Phase 8 live residuals
    runs-on: ubuntu-latest
    env:
      AIMUX_DAEMON_PORT: "47390"
    steps:
      - uses: actions/checkout@v4

      - name: Install Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ github.job }}-node-${{ hashFiles('.nvmrc', 'yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.job }}-node-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal
      # The rewrite brought compile time into CI and the caching strategy never
      # followed it: every cache here was node_modules, so each Rust job
      # cold-built the whole crate. That is most of this workflow's minutes.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install tmux and process probes
        run: |
          sudo apt-get update
          sudo apt-get install -y lsof tmux
          tmux -V
          lsof -v >/dev/null

      - name: Build native binary
        run: cargo build --manifest-path native/Cargo.toml -p aimux --bin aimux

      - name: Run live tmux residual
        env:
          AIMUX_HOME: ${{ runner.temp }}/aimux-home-phase8-tmux
        run: |
          yarn audit:phase8-live-residuals:tmux \
            --skip-build \
            --aimux-bin "$CARGO_TARGET_DIR/debug/aimux"

      - name: Run live command-resolution residual
        env:
          AIMUX_HOME: ${{ runner.temp }}/aimux-home-phase8-command-resolution
        run: |
          yarn audit:phase8-live-residuals:command-resolution \
            --skip-build \
            --aimux-bin "$CARGO_TARGET_DIR/debug/aimux"

      - name: Run live agent-shell residual
        env:
          AIMUX_HOME: ${{ runner.temp }}/aimux-home-phase8-agent-shell
        run: |
          yarn audit:phase8-live-residuals:agent-shell \
            --skip-build \
            --aimux-bin "$CARGO_TARGET_DIR/debug/aimux"

      - name: Run live graveyard residual
        env:
          AIMUX_HOME: ${{ runner.temp }}/aimux-home-phase8-graveyard
        run: |
          yarn audit:phase8-live-residuals:graveyard \
            --skip-build \
            --aimux-bin "$CARGO_TARGET_DIR/debug/aimux"

      - name: Run live Expose residual
        env:
          AIMUX_HOME: ${{ runner.temp }}/aimux-home-phase8-expose-interaction
        run: |
          yarn audit:phase8-live-residuals:expose-interaction \
            --skip-build \
            --aimux-bin "$CARGO_TARGET_DIR/debug/aimux"

      - name: Run live SSE residual
        env:
          AIMUX_HOME: ${{ runner.temp }}/aimux-home-phase8-sse
        run: |
          yarn audit:phase8-live-residuals:sse \
            --skip-build \
            --aimux-bin "$CARGO_TARGET_DIR/debug/aimux"

      - name: Run live process residual
        env:
          AIMUX_HOME: ${{ runner.temp }}/aimux-home-phase8-process
        run: |
          yarn audit:phase8-live-residuals:process \
            --skip-build \
            --aimux-bin "$CARGO_TARGET_DIR/debug/aimux"
