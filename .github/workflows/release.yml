name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"

jobs:
  readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            app/yarn.lock

      - run: corepack enable

      - run: yarn install --frozen-lockfile

      - run: yarn --cwd app install --frozen-lockfile

      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal

      - name: Prepare isolated Aimux runtime
        run: |
          set -euo pipefail
          echo "AIMUX_HOME=$RUNNER_TEMP/aimux-home-release-readiness" >> "$GITHUB_ENV"
          echo "AIMUX_TMUX_SOCKET_PATH=$RUNNER_TEMP/aimux-release-readiness-tmux.sock" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/aimux-home-release-readiness"
          printf '{"kind":"github-actions","ownerPid":%s}\n' "$$" > "$RUNNER_TEMP/aimux-home-release-readiness/test-isolation.json"

      - name: Ensure tmux is available
        run: |
          set -euo pipefail
          if command -v tmux >/dev/null 2>&1; then
            tmux -V
            exit 0
          fi
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y tmux
              ;;
            macOS)
              brew install tmux
              ;;
            *)
              echo "unsupported runner OS for installed-runtime gates: $RUNNER_OS" >&2
              exit 1
              ;;
          esac
          tmux -V

      - run: yarn release:readiness

  release-assets:
    name: Build release assets
    needs: readiness
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            variant: full
            asset: aimux-linux-x64
            runner: ubuntu-latest
          - platform: linux
            arch: x64
            variant: local
            asset: aimux-local-linux-x64
            runner: ubuntu-latest
          - platform: linux
            arch: arm64
            variant: full
            asset: aimux-linux-arm64
            runner: ubuntu-24.04-arm
          - platform: linux
            arch: arm64
            variant: local
            asset: aimux-local-linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin
            arch: x64
            variant: full
            asset: aimux-darwin-x64
            runner: macos-15-intel
          - platform: darwin
            arch: x64
            variant: local
            asset: aimux-local-darwin-x64
            runner: macos-15-intel
          - platform: darwin
            arch: arm64
            variant: full
            asset: aimux-darwin-arm64
            runner: macos-14
          - platform: darwin
            arch: arm64
            variant: local
            asset: aimux-local-darwin-arm64
            runner: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            app/yarn.lock

      - run: corepack enable

      - run: yarn install --frozen-lockfile

      - run: yarn --cwd app install --frozen-lockfile

      - name: Build release asset
        run: yarn release:asset
        env:
          AIMUX_RELEASE_PLATFORM: ${{ matrix.platform }}
          AIMUX_RELEASE_ARCH: ${{ matrix.arch }}
          AIMUX_BUILD_VARIANT: ${{ matrix.variant }}

      - name: Verify release asset has no source maps
        run: |
          set -euo pipefail
          append_standard_path_dirs() {
            local current_path="${PATH:-}"
            for dir in /usr/local/bin /opt/homebrew/bin /usr/bin /bin /usr/sbin /sbin; do
              [ -d "$dir" ] || continue
              case ":$current_path:" in
                *":$dir:"*) ;;
                *) current_path="${current_path:+$current_path:}$dir" ;;
              esac
            done
            PATH="$current_path"
            export PATH
          }
          append_standard_path_dirs
          need() {
            command -v "$1" >/dev/null 2>&1 || { echo "missing required command: $1" >&2; exit 1; }
          }
          for command in tar gzip grep; do need "$command"; done
          ASSET="release/${{ matrix.asset }}.tar.gz"
          if tar -tzf "$ASSET" | grep -E '(^|/)[^/]+\.map$'; then
            echo "Release asset contains source maps." >&2
            exit 1
          fi

      - name: Verify release variant boundary
        run: |
          set -euo pipefail
          bash scripts/check-local-build-boundary.sh \
            --variant ${{ matrix.variant }} \
            --archive release/${{ matrix.asset }}.tar.gz \
            --platform-arch ${{ matrix.platform }}-${{ matrix.arch }}

      - name: Verify release provenance and SBOM
        run: |
          set -euo pipefail
          bash scripts/verify-release-provenance.sh \
            release \
            ${{ matrix.asset }}.tar.gz \
            ${{ matrix.platform }}-${{ matrix.arch }} \
            ${{ matrix.variant }}

      - name: Verify Darwin notifier helper
        if: matrix.platform == 'darwin'
        run: |
          set -euo pipefail
          append_standard_path_dirs() {
            local current_path="${PATH:-}"
            for dir in /usr/local/bin /opt/homebrew/bin /usr/bin /bin /usr/sbin /sbin; do
              [ -d "$dir" ] || continue
              case ":$current_path:" in
                *":$dir:"*) ;;
                *) current_path="${current_path:+$current_path:}$dir" ;;
              esac
            done
            PATH="$current_path"
            export PATH
          }
          append_standard_path_dirs
          need() {
            command -v "$1" >/dev/null 2>&1 || { echo "missing required command: $1" >&2; exit 1; }
          }
          for command in tar gzip mktemp rm lipo; do need "$command"; done
          ASSET="release/${{ matrix.asset }}.tar.gz"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          tar -xzf "$ASSET" -C "$TMP_DIR" aimux/native/darwin/aimux-notifier.app
          HELPER="$TMP_DIR/aimux/native/darwin/aimux-notifier.app/Contents/MacOS/aimux-notifier"
          test -x "$HELPER"
          case "${{ matrix.arch }}" in
            x64) EXPECTED_ARCH="x86_64" ;;
            arm64) EXPECTED_ARCH="arm64" ;;
            *) echo "Unsupported Darwin arch: ${{ matrix.arch }}" >&2; exit 1 ;;
          esac
          ACTUAL_ARCHES="$(lipo -archs "$HELPER")"
          if [ "$ACTUAL_ARCHES" != "$EXPECTED_ARCH" ]; then
            echo "Expected notifier arch $EXPECTED_ARCH, got $ACTUAL_ARCHES" >&2
            exit 1
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/${{ matrix.asset }}.tar.gz
            release/${{ matrix.asset }}.tar.gz.sha256
            release/${{ matrix.asset }}.tar.gz.provenance.json
            release/${{ matrix.asset }}.tar.gz.sbom.spdx.json

      - name: Attest release asset provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/${{ matrix.asset }}.tar.gz
            release/${{ matrix.asset }}.tar.gz.sha256
            release/${{ matrix.asset }}.tar.gz.provenance.json
            release/${{ matrix.asset }}.tar.gz.sbom.spdx.json

  verify-release-assets:
    name: Verify complete release asset set
    runs-on: ubuntu-latest
    needs: release-assets
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          OWNER_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release-check
          for a in \
            aimux-darwin-arm64 aimux-darwin-x64 aimux-linux-arm64 aimux-linux-x64 \
            aimux-local-darwin-arm64 aimux-local-darwin-x64 aimux-local-linux-arm64 aimux-local-linux-x64
          do
            gh release download "$TAG" --repo "$OWNER_REPO" \
              --pattern "${a}.tar.gz" --dir release-check --clobber
            gh release download "$TAG" --repo "$OWNER_REPO" \
              --pattern "${a}.tar.gz.sha256" --dir release-check --clobber
            gh release download "$TAG" --repo "$OWNER_REPO" \
              --pattern "${a}.tar.gz.provenance.json" --dir release-check --clobber
            gh release download "$TAG" --repo "$OWNER_REPO" \
              --pattern "${a}.tar.gz.sbom.spdx.json" --dir release-check --clobber
          done

      - name: Verify complete release assets
        run: bash scripts/verify-release-asset-set.sh release-check

      - name: Verify release asset attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for a in \
            aimux-darwin-arm64 aimux-darwin-x64 aimux-linux-arm64 aimux-linux-x64 \
            aimux-local-darwin-arm64 aimux-local-darwin-x64 aimux-local-linux-arm64 aimux-local-linux-x64
          do
            gh attestation verify "release-check/${a}.tar.gz" --repo "$OWNER_REPO"
            gh attestation verify "release-check/${a}.tar.gz.sha256" --repo "$OWNER_REPO"
            gh attestation verify "release-check/${a}.tar.gz.provenance.json" --repo "$OWNER_REPO"
            gh attestation verify "release-check/${a}.tar.gz.sbom.spdx.json" --repo "$OWNER_REPO"
          done

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: verify-release-assets
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            app/yarn.lock
          registry-url: https://registry.npmjs.org

      - run: corepack enable

      - name: Use npm with trusted publishing support
        run: npm install -g npm@^11.5.1 && npm --version

      - run: yarn install --frozen-lockfile

      - run: yarn --cwd app install --frozen-lockfile

      - name: Verify package.json version matches tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED="${TAG#v}"
          if [ "$PKG_VERSION" != "$EXPECTED" ]; then
            echo "package.json version ($PKG_VERSION) does not match tag ($EXPECTED)" >&2
            exit 1
          fi

      - name: Stage macOS native assets for npm package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          OWNER_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          append_standard_path_dirs() {
            local current_path="${PATH:-}"
            for dir in /usr/local/bin /opt/homebrew/bin /usr/bin /bin /usr/sbin /sbin; do
              [ -d "$dir" ] || continue
              case ":$current_path:" in
                *":$dir:"*) ;;
                *) current_path="${current_path:+$current_path:}$dir" ;;
              esac
            done
            PATH="$current_path"
            export PATH
          }
          append_standard_path_dirs
          need() {
            command -v "$1" >/dev/null 2>&1 || { echo "missing required command: $1" >&2; exit 1; }
          }
          for command in gh mkdir tar gzip rm mv; do need "$command"; done
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          for arch in arm64 x64; do
            gh release download "$TAG" --repo "$OWNER_REPO" \
              --pattern "aimux-darwin-${arch}.tar.gz" --dir "$TMP_DIR" --clobber
            EXTRACT_DIR="$TMP_DIR/extract-${arch}"
            mkdir -p "$EXTRACT_DIR"
            tar -xzf "$TMP_DIR/aimux-darwin-${arch}.tar.gz" -C "$EXTRACT_DIR" \
              "aimux/native/darwin-${arch}/aimux" \
              aimux/native/darwin/aimux-notifier.app
            rm -rf "native/darwin-${arch}"
            mkdir -p "native/darwin-${arch}"
            mv "$EXTRACT_DIR/aimux/native/darwin-${arch}/aimux" "native/darwin-${arch}/"
            mv "$EXTRACT_DIR/aimux/native/darwin/aimux-notifier.app" "native/darwin-${arch}/"
          done

      - name: Verify npm package has no source maps
        run: |
          set -euo pipefail
          npm pack --dry-run --json > npm-pack.json
          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('npm-pack.json', 'utf8');
          const jsonStart = raw.lastIndexOf('\n[');
          const json = jsonStart >= 0 ? raw.slice(jsonStart + 1) : raw;
          const pack = JSON.parse(json)[0];
          const paths = pack.files.map((file) => file.path);
          const maps = paths
            .filter((path) => path.endsWith('.map'));
          if (maps.length > 0) {
            console.error('npm package contains source maps:');
            for (const path of maps) console.error(`- ${path}`);
            process.exit(1);
          }
          const runtimeDist = paths.filter((path) => path === 'dist' || path.startsWith('dist/'));
          if (runtimeDist.length > 0) {
            console.error('npm package contains retired CLI dist payload:');
            for (const path of runtimeDist) console.error(`- ${path}`);
            process.exit(1);
          }
          for (const required of ['native/darwin-arm64/aimux', 'native/darwin-x64/aimux']) {
            if (!paths.includes(required)) {
              console.error(`npm package is missing ${required}`);
              process.exit(1);
            }
          }
          NODE

      - run: npm publish --access public --provenance

  update-homebrew-tap:
    name: Update Homebrew tap
    runs-on: macos-15-intel
    needs: verify-release-assets
    steps:
      - name: Checkout aimux
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download Homebrew gate assets and sha256 files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          OWNER_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p sha homebrew-gate-release
          for a in \
            aimux-darwin-arm64 aimux-darwin-x64 aimux-linux-arm64 aimux-linux-x64 \
            aimux-local-darwin-arm64 aimux-local-darwin-x64 aimux-local-linux-arm64 aimux-local-linux-x64
          do
            gh release download "$TAG" --repo "$OWNER_REPO" \
              --pattern "${a}.tar.gz.sha256" --dir sha --clobber
          done
          for a in aimux-darwin-x64 aimux-local-darwin-x64; do
            gh release download "$TAG" --repo "$OWNER_REPO" \
              --pattern "${a}.tar.gz" --dir homebrew-gate-release --clobber
            gh release download "$TAG" --repo "$OWNER_REPO" \
              --pattern "${a}.tar.gz.provenance.json" --dir homebrew-gate-release --clobber
            gh release download "$TAG" --repo "$OWNER_REPO" \
              --pattern "${a}.tar.gz.sbom.spdx.json" --dir homebrew-gate-release --clobber
            cp "sha/${a}.tar.gz.sha256" homebrew-gate-release/
          done

      - name: Extract SHA values
        id: sha
        run: |
          set -euo pipefail
          extract() {
            awk '{print $1}' "sha/$1.tar.gz.sha256"
          }
          {
            echo "darwin_arm64=$(extract aimux-darwin-arm64)"
            echo "darwin_x64=$(extract aimux-darwin-x64)"
            echo "linux_arm64=$(extract aimux-linux-arm64)"
            echo "linux_x64=$(extract aimux-linux-x64)"
            echo "local_darwin_arm64=$(extract aimux-local-darwin-arm64)"
            echo "local_darwin_x64=$(extract aimux-local-darwin-x64)"
            echo "local_linux_arm64=$(extract aimux-local-linux-arm64)"
            echo "local_linux_x64=$(extract aimux-local-linux-x64)"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-aimux
        uses: actions/checkout@v4
        with:
          repository: TraderSamwise/homebrew-aimux
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Rewrite formula
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          AIMUX_HOMEBREW_FORMULA_DIR: tap/Formula
          DARWIN_ARM64: ${{ steps.sha.outputs.darwin_arm64 }}
          DARWIN_X64: ${{ steps.sha.outputs.darwin_x64 }}
          LINUX_ARM64: ${{ steps.sha.outputs.linux_arm64 }}
          LINUX_X64: ${{ steps.sha.outputs.linux_x64 }}
          LOCAL_DARWIN_ARM64: ${{ steps.sha.outputs.local_darwin_arm64 }}
          LOCAL_DARWIN_X64: ${{ steps.sha.outputs.local_darwin_x64 }}
          LOCAL_LINUX_ARM64: ${{ steps.sha.outputs.local_linux_arm64 }}
          LOCAL_LINUX_X64: ${{ steps.sha.outputs.local_linux_x64 }}
        run: |
          set -euo pipefail
          bash scripts/render-homebrew-formulas.sh

      - name: Gate Homebrew installed command
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          set -euo pipefail
          if ! brew list --formula --versions tmux >/dev/null 2>&1; then
            brew install tmux
          fi
          bash scripts/homebrew-release-dry-run.sh \
            --release-dir homebrew-gate-release \
            --host-only \
            --live-install \
            --skip-doctor-proof \
            --skip-bad-sha-proof \
            --tag "${{ steps.meta.outputs.tag }}" \
            --version "${{ steps.meta.outputs.version }}" \
            --staging-tap "aimux/release-tap-gate-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Commit and push
        working-directory: tap
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for formula in Formula/aimux.rb Formula/aimux-local.rb; do
            if [ ! -f "$formula" ]; then
              echo "Formula render did not produce $formula." >&2
              exit 1
            fi
          done
          git add Formula/aimux.rb Formula/aimux-local.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
            exit 0
          fi
          git commit -m "aimux ${TAG}"
          git push
