<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      `interactive-widget=resizes-visual` is what the composer's keyboard
      detection depends on. Which viewport a browser shrinks for a soft
      keyboard has been the UA's choice, and `lib/hardware-keyboard.ts` reads
      the gap between the visual and layout viewports to find one: a browser
      that shrinks both leaves no gap, so Enter would send on a phone and eat
      the line break. It is the spec default, declared here so it is ours.

      The rest of this file is Expo's own `output: "single"` template, which is
      only consulted at `public/index.html` -- `+html.tsx` applies to
      `output: "static"` and is silently ignored here.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, interactive-widget=resizes-visual"
    />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
