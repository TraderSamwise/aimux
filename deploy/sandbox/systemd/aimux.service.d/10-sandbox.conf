# Drop-in for whatever unit runs the aimux daemon on this host. aimux does not
# ship that unit — the host owns it — so this file only adds the two things the
# sandbox needs, and install.sh copies it to
# /etc/systemd/system/<your-unit>.service.d/10-sandbox.conf.

[Unit]
# Requires, not merely After. With ordering alone, `systemctl restart aimux`
# while the policy happened to be stopped would produce a daemon with
# unrestricted outbound and no sign that anything was wrong. Verified by
# stopping the policy — the daemon goes with it — and by deleting the table and
# starting the daemon alone, which brings the policy back first.
Requires=aimux-egress.service
After=aimux-egress.service

[Service]
# The daemon launches every pane through `env -i` with a fixed allowlist
# (src/managed-launch-env.ts), so a proxy variable set anywhere else reaches the
# daemon and stops there. Set here, it reaches the agent.
#
# Both cases, because the tools disagree: Node reads the upper-case spelling,
# Rust's reqwest (which is what codex uses) reads either, and curl reads the
# lower-case one.
Environment=HTTPS_PROXY=http://127.0.0.1:8888
Environment=HTTP_PROXY=http://127.0.0.1:8888
Environment=https_proxy=http://127.0.0.1:8888
Environment=http_proxy=http://127.0.0.1:8888
# The daemon and the project service are on loopback. Without this the agent's
# own calls to them would be posted to the proxy, which refuses anything that is
# not CONNECT to 443 on an allowlisted name.
Environment=NO_PROXY=127.0.0.1,localhost,::1
Environment=no_proxy=127.0.0.1,localhost,::1
