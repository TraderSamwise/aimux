# The only way out for the agent runtime uid.
#
# nftables drops everything else that uid sends, so this file is the egress
# policy: a hostname absent from the allowlist is a hostname the agent cannot
# reach, whatever it does with its environment.

User tinyproxy
Group tinyproxy

# Loopback only. Reachable by any local user, which is fine — the filter is the
# control, not the reachability.
Listen 127.0.0.1
Port 8888

Timeout 600
MaxClients 32
StartServers 2

LogLevel Connect
LogFile "/var/log/tinyproxy/tinyproxy.log"
PidFile "/run/tinyproxy/tinyproxy.pid"

# Deny by default. A host has to be listed to be reachable, so adding a
# capability is an edit to the allowlist and shows up in a diff.
Filter "/etc/aimux/sandbox/allowlist.txt"
FilterDefaultDeny Yes
FilterCaseSensitive No
FilterType ere

# Only CONNECT to 443. Without this line tinyproxy tunnels to ANY port on an
# allowlisted host, which turns one allowed hostname into an arbitrary outbound
# socket and quietly undoes the table next door.
ConnectPort 443

# No via/forwarded headers naming the box.
DisableViaHeader Yes
