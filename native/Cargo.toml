[workspace]
resolver = "2"
members = [
  "crates/aimux",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/TraderSamwise/aimux"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
libc = "0.2"
sha1 = "0.10"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.40", features = ["rt-multi-thread", "time"] }
# Sync websocket client: this crate is threads-and-blocking-IO throughout, so a
# tokio-based stack would drag an async runtime in for one subsystem.
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
# Blocking HTTPS for relay attachment uploads. rustls again, so there is one
# TLS stack in the binary and no system openssl on any target.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
