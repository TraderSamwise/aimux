[workspace]
resolver = "2"
members = [
  "crates/aimux",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/TraderSamwise/aimux"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
